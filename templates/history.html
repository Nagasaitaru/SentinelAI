{% extends "base.html" %}
{% block title %}Detection History{% endblock %}
{% block content %}
<section class="page-intro"><div><div class="eyebrow">AUDIT TRAIL</div><h1>Detection History</h1><p>Predictions generated by the current application session.</p></div><button class="secondary" onclick="clearHistory()">Clear History</button></section>
<section class="panel"><div class="table-wrap"><table><thead><tr><th>TIMESTAMP</th><th>RESULT</th><th>PROBABILITY</th><th>RISK</th><th>TRUST</th><th>STATUS</th></tr></thead><tbody id="historyTable"></tbody></table></div></section>
{% endblock %}
{% block scripts %}
<script>
async function loadHistory(){
 const h=await api('/api/history');
 document.getElementById('historyTable').innerHTML=h.map(x=>`<tr><td class="mono">${x.timestamp}</td><td><span class="badge ${x.label?'attack':'normal'}">${x.prediction}</span></td><td>${x.attack_probability}%</td><td>${x.risk}</td><td>${x.trust_score}%</td><td>${x.status}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No history.</td></tr>';
}
async function clearHistory(){await api('/api/history/clear',{method:'POST'});loadHistory();toast('History cleared');}
loadHistory(); setInterval(loadHistory,5000);
</script>
{% endblock %}
